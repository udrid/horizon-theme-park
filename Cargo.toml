# The "workspace": one list of all the code packages (crates) in this project,
# so they are built and tested together.
[workspace]
resolver = "2"
members = [
    "crates/park-core",
    "crates/park-sim",
    "tools/park-bundle",
    # "crates/park-web" is left out on purpose until the browser previewer starts.
]

[workspace.package]
# Same Rust "edition" (rule book) as Horizon, because the game compiles our glued code under its rules (D39).
edition = "2024"
license = "MIT"
version = "0.1.0"
