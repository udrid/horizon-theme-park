[package]
name = "park-bundle"
description = "Glues park-core into the single park.rs file that the native mod needs. Standard library only (D34)."
version.workspace = true
edition.workspace = true
license.workspace = true

# No dependencies on purpose (D34): nothing to download, and the whole tool is short enough to read.
[dependencies]

[dev-dependencies]
# Only for tests/glued.rs: the glued park.rs uses glam, exactly as inside Horizon (D9, rule 10).
glam = "=0.30.10"
# The glued park.rs saves rides with serde, exactly as inside Horizon (same versions as park-core).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
