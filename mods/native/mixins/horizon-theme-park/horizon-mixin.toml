[mod]
id = "horizon-theme-park"
version = "0.1.0"
priority = 100

# This mod uses only the stable native hook points, so it needs hook API 21
# (see ../../compatibility.json). The pinned commit is the merge of horizon#4610 (API 21).
[compatibility]
horizon_revision = "b5b451de7c9d8d3dfc851c9405d4754724205e1b"

# park.rs is the GENERATED copy of park-core (never edit it by hand, run `cargo run -p park-bundle`).
# It is added to the game as the module `crate::game::htp_park`. That name must match
# park-bundle's `crate::` rewrite (tools/park-bundle: GAME_PREFIX); a test checks it.
[[module]]
id = "park"
file = "crates/horizon-client/src/game.rs"
name = "htp_park"
source = "park.rs"

# glue.rs is our thin layer between the game and park-core: `crate::game::htp_glue`.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "htp_glue"
source = "glue.rs"

# At the start of every world phase change, tell the glue (it notes "a new world opened", and
# saves the rides when the world closes).
[[injection]]
id = "world"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_world_lifecycle"
helper = "on_world.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::WorldPhase", value = "phase" },
]

# At the start of every server tick hook, tell the glue (it runs the whole mod, step by step).
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "on_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

# When the game asks which commands mods add, the glue adds the `/coaster ...` commands.
[[injection]]
id = "commands"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "on_commands.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

# When a player types a registered command, the glue queues the order and answers them.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "on_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# A right-click on a block with the track wand (API 13): the glue claims it and queues the click.
[[injection]]
id = "use_item_on"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item_on"
helper = "on_use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# A right-click in the air with the track wand (API 13): changes the wand's mode.
[[injection]]
id = "use_item"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_use_item"
helper = "on_use_item.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# A left-click that breaks a block, with the track wand in hand (API 14): cancelled, and it undoes the last node.
[[injection]]
id = "destroy_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_destroy_block"
helper = "on_destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# M3b: draw the builder panel on the HUD while build mode is open (client, every frame).
[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "on_hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# M3b: hear key presses and mouse buttons (B, R, Z, Y, H and the right-click).
[[injection]]
id = "key"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_key"
helper = "on_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "&str", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
]

# M3b: take the mouse wheel while build mode is open.
[[injection]]
id = "wheel"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_wheel"
helper = "on_wheel.rs"
bindings = [
  { name = "steps", ty = "f32", value = "steps" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# M3b: while the builder is open, a right-click on a block belongs to it (API 21).
[[injection]]
id = "right_click_block"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_right_click_block"
helper = "on_right_click_block.rs"
bindings = [
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]
